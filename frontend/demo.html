<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meeting Transcription – demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input[type="url"], input[type="text"] { width: 100%; padding: 0.5rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; cursor: pointer; }
    pre { background: #f4f4f5; padding: 1rem; overflow: auto; border-radius: 6px; font-size: 0.85rem; }
    .hint { color: #52525b; font-size: 0.9rem; margin-top: 0.25rem; }
    .err { color: #b91c1c; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Transcrição de reunião (demo)</h1>
  <p class="hint">
    Configure a URL base da API (ex.: <code>http://127.0.0.1:8000</code>).
    Sirva este arquivo via HTTP local (pasta <code>frontend</code>: <code>python -m http.server 4173</code>)
    para o navegador enviar <code>Origin</code> e o CORS do FastAPI aceitar a requisição.
  </p>
  <form id="form">
    <label for="api">URL base da API</label>
    <input id="api" type="url" placeholder="http://127.0.0.1:8000" required />
    <label for="meeting">Nome da reunião (opcional)</label>
    <input id="meeting" type="text" placeholder="Sprint Review" />
    <label for="file">Arquivo de áudio (.wav, .mp3, .m4a)</label>
    <input id="file" type="file" accept=".wav,.mp3,.m4a,audio/*" required />
    <button type="submit" id="btn">Enviar</button>
  </form>
  <p id="status"></p>
  <pre id="out" hidden></pre>
  <p id="error" class="err"></p>
  <script>
    const form = document.getElementById("form");
    const statusEl = document.getElementById("status");
    const outEl = document.getElementById("out");
    const errEl = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.textContent = "";
      outEl.hidden = true;
      const base = document.getElementById("api").value.replace(/\/$/, "");
      const meeting = document.getElementById("meeting").value.trim();
      const fileInput = document.getElementById("file");
      if (!fileInput.files.length) return;

      const fd = new FormData();
      fd.append("file", fileInput.files[0]);
      const url = new URL("/transcribe", base.endsWith("/") ? base : base + "/");
      if (meeting) url.searchParams.set("meeting_name", meeting);

      const btn = document.getElementById("btn");
      btn.disabled = true;
      statusEl.textContent = "Processando…";
      try {
        const res = await fetch(url.toString(), { method: "POST", body: fd });
        const text = await res.text();
        let json;
        try { json = JSON.parse(text); } catch (_) { json = { raw: text }; }
        if (!res.ok) {
          errEl.textContent = res.status + " " + res.statusText + "\n" + (json.detail || JSON.stringify(json, null, 2));
          statusEl.textContent = "";
          return;
        }
        outEl.textContent = JSON.stringify(json, null, 2);
        outEl.hidden = false;
        statusEl.textContent = "Concluído.";
      } catch (err) {
        errEl.textContent = String(err);
        statusEl.textContent = "";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
